name: QA assistant harness and recorded evaluations

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gate_candidate:
        description: Fail if recorded grounded-v2 samples violate automated checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  harness:
    name: Test evaluation code and report recorded model outcomes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check code and dependencies
        run: |
          python -m pip check
          python -m ruff check .
          python -m ruff format --check .
      - name: Test checker controls and evidence integrity
        run: python -m pytest -v
      - name: Report-only replay of recorded responses; no live model call or acceptance claim
        run: python -m qa_ai replay --report-only
      - name: Optional automated candidate gate on recorded samples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gate_candidate }}
        run: python -m qa_ai replay --prompt grounded-v2 --output reports/candidate-gate.json
      - name: Upload test and evaluation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: qa-assistant-evidence
          path: reports/
          retention-days: 7
